<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kyvorix Ai — Diagnostic</title>
<script>
window.__diagErrors = [];
window.addEventListener("error", function (e) {
  window.__diagErrors.push("ERROR: " + (e.message || e.type) + " @ " + (e.filename || "?") + ":" + (e.lineno || "?"));
});
window.addEventListener("unhandledrejection", function (e) {
  window.__diagErrors.push("REJECTION: " + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="auth-view" class="auth-view">
  <div class="auth-card">
    <div class="auth-tabs">
      <button id="tab-login" class="auth-tab active" type="button">লগইন</button>
      <button id="tab-register" class="auth-tab" type="button">রেজিস্টার</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div id="name-field" class="field hidden">
        <label for="auth-name">আপনার নাম</label>
        <input id="auth-name" type="text" placeholder="যেমন: ফাহিম" />
      </div>
      <div class="field">
        <label for="auth-email">ইমেইল</label>
        <input id="auth-email" type="email" placeholder="you@example.com" required />
      </div>
      <div class="field">
        <label for="auth-password">পাসওয়ার্ড</label>
        <input id="auth-password" type="password" placeholder="কমপক্ষে ৬ অক্ষর" required minlength="6" />
      </div>
      <p id="auth-error" class="form-error hidden"></p>
      <p id="auth-success" class="form-success hidden"></p>
      <button id="auth-submit" class="btn-primary btn-block" type="submit">লগইন করুন</button>
    </form>
  </div>
</div>
<div id="app-view" class="app hidden"></div>
<div id="toast" class="toast hidden"></div>
<div style="display:none">
  <button id="logout-btn" type="button"></button>
  <button id="new-chat-btn" type="button"></button>
  <form id="composer"><textarea id="message-input"></textarea></form>
  <button id="sidebar-open" type="button"></button>
  <button id="sidebar-close" type="button"></button>
  <div id="sidebar-overlay"></div>
  <button id="admin-open-btn" type="button"></button>
  <button id="admin-close-btn" type="button"></button>
  <button id="users-refresh" type="button"></button>
  <input id="user-search" type="search" />
  <button id="provider-add-btn" type="button"></button>
  <button id="providers-refresh" type="button"></button>
  <form id="provider-form"></form>
  <button id="provider-form-cancel" type="button"></button>
  <button id="logs-refresh" type="button"></button>
  <select id="log-filter"><option value="all">all</option></select>
</div>

<pre id="diag-out" style="white-space:pre-wrap;font-size:16px;padding:16px;background:#fff;color:#000;">DIAGNOSTIC RUNNING...</pre>

<script src="app.js"></script>
<script>
window.addEventListener("load", function () {
  setTimeout(function () {
    var out = [];
    function line(s) { out.push(s); }
    line("=== KYVORIX AI DIAGNOSTIC ===");
    line("1. window.supabase: " + (typeof window.supabase));
    line("2. window.supabase.createClient: " + (window.supabase ? typeof window.supabase.createClient : "n/a"));
    line("3. window.KYVORIX_CONFIG: " + (typeof window.KYVORIX_CONFIG));
    if (window.KYVORIX_CONFIG) {
      line("   SUPABASE_URL: " + window.KYVORIX_CONFIG.SUPABASE_URL);
      line("   ANON KEY present: " + (window.KYVORIX_CONFIG.SUPABASE_ANON_KEY ? "yes, len " + window.KYVORIX_CONFIG.SUPABASE_ANON_KEY.length : "NO"));
    }
    try {
      var c = window.supabase.createClient(window.KYVORIX_CONFIG.SUPABASE_URL, window.KYVORIX_CONFIG.SUPABASE_ANON_KEY);
      line("4. createClient test: OK (no throw), auth.getSession is " + typeof c.auth.getSession);
    } catch (e) {
      line("4. createClient test: THREW -> " + e.constructor.name + ": " + e.message);
    }
    var tab = document.getElementById("tab-register");
    line("5. tab-register element exists: " + !!tab);
    var errEl = document.getElementById("auth-error");
    line("6. auth-error visible on load: " + (errEl && !errEl.classList.contains("hidden") ? "YES: " + errEl.textContent : "no (hidden or empty)"));
    if (tab) {
      tab.click();
      line("7. AFTER programmatic click on tab-register:");
      line("   tab-register has .active: " + tab.classList.contains("active"));
      line("   tab-login has .active: " + document.getElementById("tab-login").classList.contains("active"));
      line("   name-field hidden: " + document.getElementById("name-field").classList.contains("hidden"));
      line("   submit button text: " + document.getElementById("auth-submit").textContent);
    }
    line("8. window errors captured: " + (window.__diagErrors.length ? window.__diagErrors.join(" | ") : "none"));
    line("=== END ===");
    document.getElementById("diag-out").textContent = out.join("\n");
  }, 1500);
});
</script>
</body>
</html>
